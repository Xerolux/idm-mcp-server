[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "idm-heatpump-mcp"
version = "0.4.0"
description = "Safe MCP server for IDM heat pumps built on idm-heatpump-api"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = [
  "idm-heatpump-api[pymodbus,web]>=2.16.1,<3",
  "mcp[cli]>=1.2,<2",
  "pydantic-settings>=2.6,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.8,<1"]

[project.scripts]
idm-mcp = "idm_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/idm_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
